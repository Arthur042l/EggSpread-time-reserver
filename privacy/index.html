<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMatch Privacy Policy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="material/AppIcon/V3px800.png">
    <link rel="apple-touch-icon" type="image/png" href="material/AppIcon/V3px1200Sq.png">
</head>
<body class="bg-custom-gradient min-h-screen text-slate-800 font-sans antialiased pb-12">
    <header id="main-header" class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-700/60 sticky top-0 z-50 text-white">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 h-16 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-3 cursor-pointer">
                <div class="p-1 rounded-xl shadow font-bold">
                    <img src="/material/AppIcon/V3px800.png" alt="DateMatch Icon" class="w-9 h-9" onerror="this.style.display='none'">
                </div>
                <div>
                    <span class="font-bold text-lg brand-gradient">DateMatch </span>
                    <span class="text-sm sm:text-base pl-2 text-slate-400" > Privacy Policy</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Back to Calendar</span>
                </a>
            </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 pt-6 space-y-6">
      <section class="max-w-md mx-auto my-6 sm:my-12 bg-white/95 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl border border-white/40">
          
      </section>

    </main>
    
</body>
</html>
