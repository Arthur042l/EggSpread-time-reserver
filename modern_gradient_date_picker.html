<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Gradient Date Picker</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom linear gradient background blending cyan, teal, mint, green, and yellow */
        .bg-custom-gradient {
            background: linear-gradient(135deg, #22d3ee 0%, #14b8a6 25%, #6ee7b7 50%, #4ade80 75%, #fde047 100%);
        }
    </style>
</head>
<body class="bg-custom-gradient min-h-screen w-full flex items-center justify-center p-4 sm:p-6 lg:p-8 font-sans text-slate-800 relative overflow-x-hidden">

    <!-- Decorative Blur Background Orbs -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-cyan-300/50 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/2 -right-24 w-96 h-96 bg-yellow-200/50 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 left-1/3 w-96 h-96 bg-teal-300/40 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Card Container -->
    <div class="w-full max-w-5xl bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/60 overflow-hidden flex flex-col lg:flex-row transition-all duration-300 relative z-10">
        
        <!-- Left Sidebar: Shortcuts, Modes & Details -->
        <div class="w-full lg:w-80 bg-slate-900/5 backdrop-blur-md p-6 border-b lg:border-b-0 lg:border-r border-slate-200/50 flex flex-col justify-between space-y-6">
            <div>
                <!-- Header -->
                <div class="flex items-center space-x-3 mb-6">
                    <div class="p-2.5 bg-teal-600 text-white rounded-2xl shadow-lg shadow-teal-500/30">
                        <i data-lucide="calendar" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold bg-gradient-to-r from-teal-700 to-emerald-700 bg-clip-text text-transparent">
                            Date Selector
                        </h1>
                        <p class="text-xs text-slate-500 font-medium">HTML & CSS Gradient Picker</p>
                    </div>
                </div>

                <!-- Mode Switcher -->
                <div class="bg-slate-200/60 p-1 rounded-2xl flex text-sm font-semibold mb-6">
                    <button id="btn-single-mode" onclick="setMode(false)" class="flex-1 py-2 rounded-xl transition-all duration-200 bg-white text-teal-700 shadow-md shadow-slate-200/50">
                        Single Date
                    </button>
                    <button id="btn-range-mode" onclick="setMode(true)" class="flex-1 py-2 rounded-xl transition-all duration-200 text-slate-600 hover:text-slate-900">
                        Date Range
                    </button>
                </div>

                <!-- Presets / Shortcuts -->
                <div class="space-y-2 mb-6">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">
                        Quick Selection
                    </span>
                    <div class="grid grid-cols-2 lg:grid-cols-1 gap-2">
                        <button onclick="handleShortcut('today')" class="flex items-center justify-between px-3.5 py-2.5 bg-white/70 hover:bg-white text-slate-700 rounded-xl text-xs font-semibold border border-slate-200/60 shadow-sm hover:shadow transition-all">
                            <span>Today</span>
                            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-teal-500"></i>
                        </button>
                        <button onclick="handleShortcut('tomorrow')" class="flex items-center justify-between px-3.5 py-2.5 bg-white/70 hover:bg-white text-slate-700 rounded-xl text-xs font-semibold border border-slate-200/60 shadow-sm hover:shadow transition-all">
                            <span>Tomorrow</span>
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-400"></i>
                        </button>
                        <button onclick="handleShortcut('next7')" class="flex items-center justify-between px-3.5 py-2.5 bg-white/70 hover:bg-white text-slate-700 rounded-xl text-xs font-semibold border border-slate-200/60 shadow-sm hover:shadow transition-all">
                            <span>Next 7 Days</span>
                            <i data-lucide="bookmark" class="w-3.5 h-3.5 text-emerald-500"></i>
                        </button>
                        <button onclick="handleShortcut('next30')" class="flex items-center justify-between px-3.5 py-2.5 bg-white/70 hover:bg-white text-slate-700 rounded-xl text-xs font-semibold border border-slate-200/60 shadow-sm hover:shadow transition-all">
                            <span>Next 30 Days</span>
                            <i data-lucide="bookmark" class="w-3.5 h-3.5 text-cyan-500"></i>
                        </button>
                    </div>
                </div>

                <!-- Selected Info Summary -->
                <div class="p-4 bg-gradient-to-br from-teal-50 to-emerald-50 rounded-2xl border border-teal-100/80 shadow-inner">
                    <span class="text-xs font-bold text-teal-800 tracking-wider uppercase block mb-1">
                        Selected
                    </span>
                    <div id="selection-summary" class="text-lg font-bold text-teal-800">
                        <!-- Dynamic Summary Content -->
                    </div>
                </div>
            </div>

            <!-- Time Picker Bar -->
            <div class="pt-4 border-t border-slate-200/50">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="clock" class="w-3.5 h-3.5 text-teal-600"></i> Set Time
                    </span>
                </div>
                <input type="time" id="time-picker" value="12:00" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-slate-700 font-bold focus:outline-none focus:ring-2 focus:ring-teal-500/50 shadow-sm">
            </div>
        </div>

        <!-- Right Side: Calendar & Tasks -->
        <div class="flex-1 p-6 lg:p-8 flex flex-col justify-between">
            <div>
                <!-- Header / Month Navigation -->
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center space-x-2">
                        <button id="month-label" onclick="toggleView('months')" class="text-2xl font-bold text-slate-800 hover:text-teal-600 transition-colors">
                            January
                        </button>
                        <button id="year-label" onclick="toggleView('years')" class="text-2xl font-semibold text-slate-400 hover:text-teal-600 transition-colors">
                            2026
                        </button>
                    </div>

                    <div class="flex items-center space-x-1.5">
                        <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-xl text-slate-600 hover:text-slate-900 transition-colors" title="Previous Month">
                            <i data-lucide="chevron-left" class="w-5 h-5"></i>
                        </button>
                        <button onclick="resetToToday()" class="px-3 py-1.5 text-xs font-bold text-teal-700 bg-teal-50 hover:bg-teal-100 rounded-xl transition-colors">
                            Today
                        </button>
                        <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-xl text-slate-600 hover:text-slate-900 transition-colors" title="Next Month">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Calendar View Container -->
                <div id="calendar-view">
                    <!-- Days of Week Header -->
                    <div class="grid grid-cols-7 mb-2 text-center">
                        <div class="py-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Sun</div>
                        <div class="py-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Mon</div>
                        <div class="py-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Tue</div>
                        <div class="py-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Wed</div>
                        <div class="py-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Thu</div>
                        <div class="py-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Fri</div>
                        <div class="py-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Sat</div>
                    </div>

                    <!-- Days Grid -->
                    <div id="days-grid" class="grid grid-cols-7 gap-1.5 sm:gap-2"></div>
                </div>

                <!-- Overlay Views (Months / Years Selector) -->
                <div id="months-overlay" class="hidden grid grid-cols-3 gap-3 my-6"></div>
                <div id="years-overlay" class="hidden grid grid-cols-4 gap-3 my-6 max-h-64 overflow-y-auto pr-1"></div>
            </div>

            <!-- Bottom Events & Reminders Panel -->
            <div class="mt-6 pt-6 border-t border-slate-200/60">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-bold text-slate-700 flex items-center gap-2">
                        <span>Events & Notes</span>
                        <span id="selected-date-badge" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">
                            Selected Date
                        </span>
                    </h3>
                </div>

                <!-- Event Badges List -->
                <div id="event-list" class="flex gap-2 overflow-x-auto pb-2 mb-3 min-h-[38px] items-center"></div>

                <!-- Add Event Form -->
                <form onsubmit="handleAddEvent(event)" class="flex gap-2">
                    <input type="text" id="event-input" placeholder="Add a reminder or event..." class="flex-1 px-3.5 py-2 bg-white/70 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-teal-500/50 shadow-sm">
                    <button type="submit" class="px-3 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-teal-600/20 flex items-center gap-1 transition-all">
                        <i data-lucide="plus" class="w-4 h-4"></i> Add
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // App State
        let selectedDate = new Date();
        let currentMonth = new Date();
        let isRangeMode = false;
        let rangeStartDate = null;
        let rangeEndDate = null;
        let viewMode = 'days'; // 'days', 'months', 'years'

        const months = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        let events = {
            [formatDateKey(new Date())]: ['Team Sync Meeting', 'Review Designs']
        };

        // Date Helpers
        function formatDateKey(date) {
            if (!date) return '';
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function isSameDay(d1, d2) {
            if (!d1 || !d2) return false;
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        function isToday(date) {
            return isSameDay(date, new Date());
        }

        function isDateInRange(date) {
            if (!rangeStartDate || !rangeEndDate) return false;
            const time = date.getTime();
            return time >= rangeStartDate.getTime() && time <= rangeEndDate.getTime();
        }

        // Mode Switching
        function setMode(rangeMode) {
            isRangeMode = rangeMode;
            const btnSingle = document.getElementById('btn-single-mode');
            const btnRange = document.getElementById('btn-range-mode');

            if (isRangeMode) {
                btnRange.className = "flex-1 py-2 rounded-xl transition-all duration-200 bg-white text-teal-700 shadow-md shadow-slate-200/50";
                btnSingle.className = "flex-1 py-2 rounded-xl transition-all duration-200 text-slate-600 hover:text-slate-900";
            } else {
                btnSingle.className = "flex-1 py-2 rounded-xl transition-all duration-200 bg-white text-teal-700 shadow-md shadow-slate-200/50";
                btnRange.className = "flex-1 py-2 rounded-xl transition-all duration-200 text-slate-600 hover:text-slate-900";
            }
            render();
        }

        // Shortcuts
        function handleShortcut(type) {
            const today = new Date();
            isRangeMode = false;
            setMode(false);

            if (type === 'today') {
                selectedDate = today;
                currentMonth = new Date(today);
            } else if (type === 'tomorrow') {
                const tomorrow = new Date(today);
                tomorrow.setDate(today.getDate() + 1);
                selectedDate = tomorrow;
                currentMonth = new Date(tomorrow);
            } else if (type === 'next7') {
                setMode(true);
                const next7 = new Date(today);
                next7.setDate(today.getDate() + 6);
                rangeStartDate = today;
                rangeEndDate = next7;
                currentMonth = new Date(today);
            } else if (type === 'next30') {
                setMode(true);
                const next30 = new Date(today);
                next30.setDate(today.getDate() + 29);
                rangeStartDate = today;
                rangeEndDate = next30;
                currentMonth = new Date(today);
            }
            render();
        }

        // Month Navigation
        function changeMonth(delta) {
            currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + delta, 1);
            render();
        }

        function resetToToday() {
            currentMonth = new Date();
            selectedDate = new Date();
            render();
        }

        function toggleView(mode) {
            viewMode = (viewMode === mode) ? 'days' : mode;
            render();
        }

        // Date Click Handler
        function handleDateClick(year, month, day) {
            const clickedDate = new Date(year, month, day);

            if (isRangeMode) {
                if (!rangeStartDate || (rangeStartDate && rangeEndDate)) {
                    rangeStartDate = clickedDate;
                    rangeEndDate = null;
                } else {
                    if (clickedDate < rangeStartDate) {
                        rangeEndDate = rangeStartDate;
                        rangeStartDate = clickedDate;
                    } else {
                        rangeEndDate = clickedDate;
                    }
                }
            } else {
                selectedDate = clickedDate;
            }
            render();
        }

        // Event Handling
        function handleAddEvent(e) {
            e.preventDefault();
            const input = document.getElementById('event-input');
            const text = input.value.trim();
            if (!text) return;

            const dateKey = formatDateKey(selectedDate);
            if (!events[dateKey]) events[dateKey] = [];
            events[dateKey].push(text);
            input.value = '';
            render();
        }

        function deleteEvent(index) {
            const dateKey = formatDateKey(selectedDate);
            if (events[dateKey]) {
                events[dateKey].splice(index, 1);
            }
            render();
        }

        // Rendering Functions
        function render() {
            // Update Headers
            document.getElementById('month-label').innerText = months[currentMonth.getMonth()];
            document.getElementById('year-label').innerText = currentMonth.getFullYear();

            // Update Summary Text
            const summaryContainer = document.getElementById('selection-summary');
            if (isRangeMode) {
                const startStr = rangeStartDate ? rangeStartDate.toLocaleDateString() : 'Select Start';
                const endStr = rangeEndDate ? rangeEndDate.toLocaleDateString() : 'Select End';
                summaryContainer.innerHTML = `
                    <div class="text-sm font-semibold text-slate-700 space-y-1">
                        <div>From: <span class="text-teal-700 font-bold">${startStr}</span></div>
                        <div>To: <span class="text-teal-700 font-bold">${endStr}</span></div>
                    </div>
                `;
            } else {
                summaryContainer.innerText = selectedDate.toLocaleDateString('en-US', {
                    weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
                });
            }

            // View Overlays Toggle
            const calendarView = document.getElementById('calendar-view');
            const monthsOverlay = document.getElementById('months-overlay');
            const yearsOverlay = document.getElementById('years-overlay');

            calendarView.classList.toggle('hidden', viewMode !== 'days');
            monthsOverlay.classList.toggle('hidden', viewMode !== 'months');
            yearsOverlay.classList.toggle('hidden', viewMode !== 'years');

            if (viewMode === 'days') renderDaysGrid();
            if (viewMode === 'months') renderMonthsOverlay();
            if (viewMode === 'years') renderYearsOverlay();

            renderEvents();
            lucide.createIcons();
        }

        function renderDaysGrid() {
            const daysGrid = document.getElementById('days-grid');
            daysGrid.innerHTML = '';

            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            const prevMonthDays = new Date(year, month, 0).getDate();

            // Previous month padding days
            for (let i = firstDay - 1; i >= 0; i--) {
                const dayNum = prevMonthDays - i;
                const cellDate = new Date(year, month - 1, dayNum);
                createDayButton(daysGrid, dayNum, false, cellDate, year, month - 1);
            }

            // Current month days
            for (let day = 1; day <= daysInMonth; day++) {
                const cellDate = new Date(year, month, day);
                createDayButton(daysGrid, day, true, cellDate, year, month);
            }

            // Next month padding days
            const totalCells = daysGrid.children.length;
            const remainingCells = 42 - totalCells;
            for (let i = 1; i <= remainingCells; i++) {
                const cellDate = new Date(year, month + 1, i);
                createDayButton(daysGrid, i, false, cellDate, year, month + 1);
            }
        }

        function createDayButton(container, dayNum, isCurrentMonth, cellDate, year, month) {
            const btn = document.createElement('button');
            btn.onclick = () => handleDateClick(year, month, dayNum);

            const isSelected = !isRangeMode && isSameDay(cellDate, selectedDate);
            const isRangeStart = isRangeMode && isSameDay(cellDate, rangeStartDate);
            const isRangeEnd = isRangeMode && isSameDay(cellDate, rangeEndDate);
            const inRange = isRangeMode && isDateInRange(cellDate);
            const currentDayIsToday = isToday(cellDate);
            const hasEvents = (events[formatDateKey(cellDate)] || []).length > 0;

            let styleClasses = "relative aspect-square rounded-2xl flex flex-col items-center justify-center text-sm sm:text-base font-medium transition-all duration-200 ";

            if (!isCurrentMonth) {
                styleClasses += "bg-transparent text-slate-300 hover:text-slate-500";
            } else if (isSelected || isRangeStart || isRangeEnd) {
                styleClasses += "bg-gradient-to-r from-teal-500 to-emerald-500 text-white font-bold shadow-lg shadow-teal-500/30 scale-105 z-10";
            } else if (inRange) {
                styleClasses += "bg-teal-100/80 text-teal-900 font-semibold";
            } else {
                styleClasses += "bg-white/40 hover:bg-white/90 text-slate-700";
            }

            btn.className = styleClasses;
            btn.innerHTML = `
                <span>${dayNum}</span>
                <div class="absolute bottom-1.5 flex space-x-1">
                    ${currentDayIsToday && !isSelected ? '<span class="w-1.5 h-1.5 bg-cyan-500 rounded-full"></span>' : ''}
                    ${hasEvents ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-yellow-300' : 'bg-emerald-500'}"></span>` : ''}
                </div>
            `;
            container.appendChild(btn);
        }

        function renderMonthsOverlay() {
            const overlay = document.getElementById('months-overlay');
            overlay.innerHTML = '';
            months.forEach((m, idx) => {
                const btn = document.createElement('button');
                btn.onclick = () => {
                    currentMonth = new Date(currentMonth.getFullYear(), idx, 1);
                    viewMode = 'days';
                    render();
                };
                const isCurrent = currentMonth.getMonth() === idx;
                btn.className = `py-3 rounded-2xl font-semibold text-sm border transition-all ${
                    isCurrent ? 'bg-teal-600 text-white border-teal-600 shadow-md' : 'bg-white/60 hover:bg-white text-slate-700 border-slate-200'
                }`;
                btn.innerText = m;
                overlay.appendChild(btn);
            });
        }

        function renderYearsOverlay() {
            const overlay = document.getElementById('years-overlay');
            overlay.innerHTML = '';
            const currentYear = currentMonth.getFullYear();
            for (let i = currentYear - 10; i <= currentYear + 13; i++) {
                const btn = document.createElement('button');
                btn.onclick = () => {
                    currentMonth = new Date(i, currentMonth.getMonth(), 1);
                    viewMode = 'days';
                    render();
                };
                const isCurrent = currentYear === i;
                btn.className = `py-3 rounded-2xl font-semibold text-sm border transition-all ${
                    isCurrent ? 'bg-teal-600 text-white border-teal-600 shadow-md' : 'bg-white/60 hover:bg-white text-slate-700 border-slate-200'
                }`;
                btn.innerText = i;
                overlay.appendChild(btn);
            }
        }

        function renderEvents() {
            const badge = document.getElementById('selected-date-badge');
            badge.innerText = selectedDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

            const eventList = document.getElementById('event-list');
            eventList.innerHTML = '';

            const key = formatDateKey(selectedDate);
            const currentEvents = events[key] || [];

            if (currentEvents.length === 0) {
                eventList.innerHTML = `<span class="text-xs text-slate-400 italic py-1">No tasks for this date.</span>`;
                return;
            }

            currentEvents.forEach((item, index) => {
                const chip = document.createElement('div');
                chip.className = "flex-none flex items-center gap-2 px-3 py-1.5 bg-white/80 border border-slate-200/80 rounded-xl text-xs font-semibold text-slate-700 shadow-sm";
                chip.innerHTML = `
                    <span>${item}</span>
                    <button onclick="deleteEvent(${index})" class="text-slate-400 hover:text-red-500 transition-colors">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                eventList.appendChild(chip);
            });
        }

        // Initialize App
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
